<div
  class="canvas-node"
  [class.canvas-node--selected]="node.selected"
  [class.canvas-node--breakpoint]="node.breakpoint"
  [class.canvas-node--current]="node.current"
  [class.canvas-node--branch]="isBranchNode"
  [class.canvas-node--if]="node.nodeType === 'if'"
  [class.canvas-node--try-catch]="node.nodeType === 'tryCatch'"
  [class.canvas-node--loop]="node.nodeType === 'forEach' || node.nodeType === 'for' || node.nodeType === 'while'"
  role="button"
  tabindex="0"
  [attr.aria-label]="('canvas.node.ariaLabel' | translate) + ': ' + node.label"
  [attr.aria-selected]="!!node.selected"
  [attr.data-node-id]="node.id"
  [attr.data-node-type]="node.nodeType"
  [attr.data-breakpoint]="!!node.breakpoint"
  [attr.data-current]="!!node.current"
  data-testid="canvas-node"
  (keydown.enter)="select()"
  (keydown.space)="select()"
  (pointerup)="onPointerUp()"
>
  @if (node.breakpoint) {
    <span class="canvas-node__breakpoint" data-testid="canvas-node-breakpoint" aria-hidden="true"></span>
  }
  <div class="canvas-node__inputs" [class.canvas-node__inputs--multiple]="inputSockets.length > 1">
    @for (socket of inputSockets; track socket.port) {
      <span
        class="canvas-node__socket canvas-node__socket--in"
        data-testid="canvas-node-socket-in"
        [attr.data-port]="socket.port"
        [attr.title]="socket.label"
        aria-hidden="true"
        (pointerup)="onInputPointerUp($event, socket.port)"
      ></span>
    }
  </div>

  <header class="canvas-node__header">
    <span class="canvas-node__icon" aria-hidden="true">{{ node.icon || '▸' }}</span>
    <span class="canvas-node__title" data-testid="canvas-node-title">{{ node.label }}</span>
    <button
      type="button"
      class="canvas-node__delete"
      data-testid="canvas-node-delete"
      [attr.aria-label]="'canvas.node.delete' | translate"
      (click)="remove($event)"
    >
      ✕
    </button>
  </header>

  @if (node.activityId) {
    <p class="canvas-node__subtitle">{{ node.activityId }}</p>
  }

  <div class="canvas-node__outputs" [class.canvas-node__outputs--stacked]="outputSockets.length > 2">
    @for (socket of outputSockets; track socket.port) {
      <div class="canvas-node__output" [class.canvas-node__output--stacked]="outputSockets.length > 2">
        <span class="canvas-node__output-label">{{ socket.label }}</span>
        <span
          class="canvas-node__socket canvas-node__socket--out"
          [class.canvas-node__socket--positive]="socket.tone === 'positive'"
          [class.canvas-node__socket--negative]="socket.tone === 'negative'"
          [class.canvas-node__socket--neutral]="socket.tone === 'neutral'"
          data-testid="canvas-node-socket-out"
          data-socket-direction="out"
          [attr.data-port]="socket.port"
          aria-hidden="true"
          (pointerdown)="onOutSocketDown($event, socket.port)"
        ></span>
      </div>
    }
  </div>
</div>
