<div
  class="designer flex h-full w-full"
  (keydown.control.s)="onSaveShortcut($event)"
  tabindex="-1"
>
  @if (isSimpleMode()) {
    <app-simplified-toolbox [canvas]="canvas()"></app-simplified-toolbox>
  } @else {
    <app-toolbox [canvas]="canvas()"></app-toolbox>
  }
  <main class="designer__canvas relative flex-1">
    <div class="designer__header">
      <app-simple-mode-toggle></app-simple-mode-toggle>
      @if (workflowId()) {
        <span class="designer__title" data-testid="designer-title">
          {{ workflow()?.name }}
          @if (dirty()) {
            <span class="designer__dirty" data-testid="designer-dirty" aria-hidden="true">●</span>
          }
        </span>
        <button
          type="button"
          class="designer__save"
          data-testid="designer-save"
          [disabled]="saveState() === 'saving'"
          (click)="save()"
        >
          {{ 'designer.save' | translate }}
        </button>
        @if (saveState() === 'error') {
          <span class="designer__save-error text-red-600" data-testid="designer-save-error">
            {{ 'designer.saveError' | translate }}
          </span>
        }
      }
      @if (!isSimpleMode()) {
        <button
          type="button"
          class="designer__debug-toggle"
          data-testid="designer-debug-toggle"
          [attr.aria-pressed]="debugMode()"
          [attr.aria-label]="'debug.panel.title' | translate"
          (click)="toggleDebug()"
        >
          {{ 'debug.panel.title' | translate }}
        </button>
      }
    </div>
    <app-canvas
      [workflow]="workflow()"
      [breakpointNodeIds]="breakpointNodeIds()"
      [currentNodeId]="debugCurrentNodeId()"
      (nodeSelect)="onNodeSelect($event)"
      (graphChanged)="onGraphChanged($event)"
    ></app-canvas>
  </main>
  @if (!isSimpleMode() && debugMode()) {
    <app-debug-panel
      [workflow]="currentGraph() ?? workflow()"
      (currentNodeChange)="onDebugCurrentNode($event)"
    ></app-debug-panel>
  } @else {
    <app-properties-panel
      [activityType]="selectedActivityType()"
      [properties]="selectedProperties()"
      (propertiesChange)="onPropertiesChange($event)"
    ></app-properties-panel>
  }
</div>
