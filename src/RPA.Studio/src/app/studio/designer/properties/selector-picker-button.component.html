@if (isImage) {
  <span class="selector-picker__capture" data-testid="selector-picker-capture">
    <select
      class="selector-picker__mode"
      data-testid="selector-picker-mode"
      [disabled]="state() === 'picking'"
      [ngModel]="captureMode()"
      (ngModelChange)="onModeChange($event)"
      [title]="'picker.captureMode' | translate"
    >
      <option value="f2">{{ 'picker.modeF2' | translate }}</option>
      <option value="timer">{{ 'picker.modeTimer' | translate }}</option>
    </select>
    @if (captureMode() === 'timer') {
      <input
        type="number"
        class="selector-picker__delay"
        data-testid="selector-picker-delay"
        min="1"
        max="120"
        [disabled]="state() === 'picking'"
        [ngModel]="delaySeconds()"
        (ngModelChange)="onDelayChange($event)"
        [title]="'picker.delaySeconds' | translate"
      />
      <span class="selector-picker__unit">{{ 'picker.seconds' | translate }}</span>
    }
    @if (captureMode() === 'f2') {
      <label class="selector-picker__mod" [title]="'picker.ctrl' | translate">
        <input type="checkbox" data-testid="selector-picker-ctrl"
          [disabled]="state() === 'picking'"
          [ngModel]="ctrl()" (ngModelChange)="ctrl.set($event)" />Ctrl
      </label>
      <label class="selector-picker__mod" [title]="'picker.shift' | translate">
        <input type="checkbox" data-testid="selector-picker-shift"
          [disabled]="state() === 'picking'"
          [ngModel]="shift()" (ngModelChange)="shift.set($event)" />Shift
      </label>
      <label class="selector-picker__mod" [title]="'picker.alt' | translate">
        <input type="checkbox" data-testid="selector-picker-alt"
          [disabled]="state() === 'picking'"
          [ngModel]="alt()" (ngModelChange)="alt.set($event)" />Alt
      </label>
      <select
        class="selector-picker__mode"
        data-testid="selector-picker-hotkey"
        [disabled]="state() === 'picking'"
        [ngModel]="hotKey()"
        (ngModelChange)="onHotKeyChange($event)"
        [title]="'picker.freezeKey' | translate"
      >
        @for (k of hotKeys; track k) {
          <option [value]="k">{{ k }}</option>
        }
      </select>
    }
  </span>
}
<button
  type="button"
  class="selector-picker"
  data-testid="selector-picker"
  [disabled]="state() === 'picking'"
  [title]="'picker.pick' | translate"
  (click)="pick()"
>
  <span aria-hidden="true">+</span>
  <span class="selector-picker__label">{{ 'picker.pick' | translate }}</span>
</button>
@if (state() === 'picking') {
  <span class="selector-picker__status" data-testid="selector-picker-status">
    {{ 'picker.waitingSap' | translate }}
  </span>
}
@if (state() === 'error') {
  <span class="selector-picker__status selector-picker__status--error" data-testid="selector-picker-error">
    {{ 'picker.failed' | translate }}
  </span>
}
