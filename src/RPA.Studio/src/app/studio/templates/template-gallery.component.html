<div
  class="template-gallery"
  data-testid="template-gallery-root"
  [attr.aria-label]="'templates.gallery.ariaLabel' | translate"
>
  <div class="template-gallery__header" style="display: flex; align-items: center; gap: 0.75rem;">
    <app-back-home />
    <h1 class="template-gallery__title">{{ 'templates.gallery.title' | translate }}</h1>
  </div>

  <div class="template-gallery__search">
    <label class="sr-only" for="template-search">{{ 'templates.gallery.searchLabel' | translate }}</label>
    <input
      id="template-search"
      type="text"
      data-testid="template-search"
      class="template-gallery__search-input"
      [attr.aria-label]="'templates.gallery.searchLabel' | translate"
      [placeholder]="'templates.gallery.searchPlaceholder' | translate"
      [value]="searchTerm()"
      (input)="onSearchChange($any($event.target).value)"
    />
  </div>

  <div
    class="template-gallery__filters"
    role="group"
    [attr.aria-label]="'templates.gallery.filterAriaLabel' | translate"
  >
    <button
      type="button"
      class="template-gallery__filter-btn"
      [class.template-gallery__filter-btn--active]="selectedCategory() === ALL_CATEGORIES"
      data-testid="template-filter-all"
      (click)="selectCategory(ALL_CATEGORIES)"
    >
      {{ 'templates.gallery.filterAll' | translate }}
    </button>
    <button
      *ngFor="let category of categories()"
      type="button"
      class="template-gallery__filter-btn"
      [class.template-gallery__filter-btn--active]="selectedCategory() === category"
      [attr.data-testid]="'template-filter-' + category"
      (click)="selectCategory(category)"
    >
      {{ category }}
    </button>
  </div>

  <div class="template-gallery__content">
    <p *ngIf="loading()" class="template-gallery__status" data-testid="template-gallery-loading">
      {{ 'templates.gallery.loading' | translate }}
    </p>
    <p *ngIf="error()" class="template-gallery__status template-gallery__status--error" data-testid="template-gallery-error">
      {{ 'templates.gallery.error' | translate }}
    </p>
    <p
      *ngIf="!loading() && !error() && filteredTemplates().length === 0"
      class="template-gallery__status"
      data-testid="template-gallery-empty"
    >
      {{ 'templates.gallery.empty' | translate }}
    </p>

    <div class="template-gallery__grid">
      <app-template-card
        *ngFor="let template of filteredTemplates(); trackBy: trackByTemplateId"
        [template]="template"
        (select)="openWizard($event)"
      ></app-template-card>
    </div>
  </div>

  <div
    *ngIf="selectedTemplate()"
    class="template-gallery__wizard-overlay"
    (click)="closeWizard()"
  >
    <div class="template-gallery__wizard-container" (click)="$event.stopPropagation()">
      <app-template-wizard
        [template]="selectedTemplate()!"
        (close)="closeWizard()"
        (created)="onWorkflowCreated($event)"
      ></app-template-wizard>
    </div>
  </div>
</div>
